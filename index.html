<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼字大冒險 🏆</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #4ECDC4; --locked: #BDC3C7; --success: #7ED321; --bg: #F0F9FF; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; width: 90%; max-width: 500px; padding: 30px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        
        /* 關卡地圖樣式 */
        .level-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .level-btn { width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 24px; font-weight: bold; color: white; cursor: pointer; transition: 0.3s; position: relative; }
        .level-btn.unlocked { background: var(--primary); box-shadow: 0 5px 0 #36B5AC; }
        .level-btn.unlocked:active { transform: translateY(4px); box-shadow: 0 1px 0 #36B5AC; }
        .level-btn.locked { background: var(--locked); cursor: not-allowed; }
        .level-btn.locked::after { content: '🔒'; position: absolute; top: -10px; right: -5px; font-size: 16px; }
        
        /* 遊戲畫面樣ize */
        .game-view { display: none; }
        .word-img { width: 150px; height: 150px; object-fit: contain; margin-bottom: 10px; }
        .letter-inputs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
        .letter-box { width: 35px; height: 45px; font-size: 28px; text-align: center; border: 3px solid #CFD8DC; border-radius: 8px; outline: none; }
        .letter-box.correct { background: #E8F5E9; border-color: var(--success); color: var(--success); }
        .back-btn { margin-top: 20px; background: none; border: 1px solid #ccc; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="menu-view">
        <h1>🌟 拼字大冒險</h1>
        <p>請選擇一個關卡開始：</p>
        <div class="level-map" id="level-map"></div>
    </div>

    <div id="game-view" class="game-view">
        <div id="level-info" style="color: #888; margin-bottom: 10px;">Level 1</div>
        <img id="word-img" class="word-img" src="" onclick="speak()">
        <div id="hint-area" class="letter-inputs"></div>
        <p id="feedback" style="font-weight: bold; min-height: 24px;"></p>
        <button class="back-btn" onclick="showMenu()">⬅️ 回到地圖</button>
    </div>
</div>

<script>
    const levels = [
        { w: "fish",      pattern: "f_sh",   img: "https://img.freepik.com/free-vector/cute-orange-fish-swimming-cartoon-vector-icon-illustration_138676-4357.jpg" },
        { w: "bird",      pattern: "_i_d",   img: "https://img.freepik.com/free-vector/cute-blue-bird-cartoon-character_1308-133545.jpg" },
        { w: "circle",    pattern: "c_r_le", img: "https://img.freepik.com/free-vector/red-circle-basic-geometric-shape-kids_53876-146337.jpg" },
        { w: "triangle",  pattern: "tr_a_gle",img: "https://img.freepik.com/free-vector/yellow-triangle-basic-geometric-shape-kids_53876-146338.jpg" },
        { w: "polygon",   pattern: "p_l_gon", img: "https://img.freepik.com/free-vector/colorful-set-polygons-geometric-shapes_23-2148419230.jpg" },
        { w: "reptile",   pattern: "r_pt_le",img: "https://img.freepik.com/free-vector/cute-turtle-walking-cartoon-vector-icon-illustration_138676-3914.jpg" },
        { w: "amphibian", pattern: "a_p_ib_an",img: "https://img.freepik.com/free-vector/cute-frog-sitting-lotus-leaf-cartoon-vector-icon-illustration_138676-5380.jpg" }
    ];

    let unlockedLevel = 1; // 目前解鎖到第幾關
    let currentLevelIdx = 0;

    function renderMap() {
        const map = document.getElementById('level-map');
        map.innerHTML = '';
        levels.forEach((_, index) => {
            const levelNum = index + 1;
            const btn = document.createElement('button');
            btn.innerText = levelNum;
            if (levelNum <= unlockedLevel) {
                btn.className = 'level-btn unlocked';
                btn.onclick = () => startLevel(index);
            } else {
                btn.className = 'level-btn locked';
            }
            map.appendChild(btn);
        });
    }

    function startLevel(idx) {
        currentLevelIdx = idx;
        document.getElementById('menu-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'block';
        document.getElementById('level-info').innerText = `Level ${idx + 1}`;
        initGame();
    }

    function showMenu() {
        document.getElementById('menu-view').style.display = 'block';
        document.getElementById('game-view').style.display = 'none';
        renderMap();
    }

    function initGame() {
        const item = levels[currentLevelIdx];
        document.getElementById('word-img').src = item.img;
        const hintArea = document.getElementById('hint-area');
        hintArea.innerHTML = '';
        document.getElementById('feedback').innerText = '';

        for (let i = 0; i < item.w.length; i++) {
            const char = item.pattern[i];
            if (char === "_") {
                const input = document.createElement('input');
                input.type = "text";
                input.maxLength = 1;
                input.className = "letter-box";
                input.dataset.correct = item.w[i];
                input.oninput = checkLetter;
                hintArea.appendChild(input);
            } else {
                const div = document.createElement('div');
                div.className = "letter-box";
                div.style.background = "#ECEFF1";
                div.innerText = char.toUpperCase();
                hintArea.appendChild(div);
            }
        }
        focusNext();
    }

    function checkLetter(e) {
        const input = e.target;
        if (input.value.toLowerCase() === input.dataset.correct) {
            input.classList.add('correct');
            input.disabled = true;
            if ([...document.querySelectorAll('#hint-area input')].every(i => i.disabled)) {
                handleWin();
            } else {
                focusNext();
            }
        } else {
            input.value = '';
        }
    }

    function handleWin() {
        confetti({ particleCount: 100, spread: 70 });
        document.getElementById('feedback').innerText = "Excellent! 🎉";
        if (currentLevelIdx + 1 === unlockedLevel && unlockedLevel < levels.length) {
            unlockedLevel++;
        }
        setTimeout(showMenu, 2000);
    }

    function focusNext() {
        const next = [...document.querySelectorAll('#hint-area input')].find(i => !i.disabled);
        if (next) next.focus();
    }

    function speak() {
        const msg = new SpeechSynthesisUtterance(levels[currentLevelIdx].w);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
    }

    renderMap();
</script>
</body>
</html>
